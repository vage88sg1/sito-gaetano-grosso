<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Dott. Gaetano Grosso</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#37545C">
<link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg?v=2">
<style>
  :root{--accent:#2B9AA6;--accent-dark:#1A6F7C;--ink:#37545C;--text:#12222A;
    --text-secondary:#3F545C;--line-strong:#C9E2E8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:18px;
    line-height:1.7;color:var(--text);background:#fff;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:560px}
  svg{width:78px;height:auto;margin-bottom:34px}
  .mm-ring,.mm-beat{stroke:var(--ink)} .mm-inner{stroke:var(--accent)}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:34px;line-height:1.15;
    margin-bottom:14px}
  p{color:var(--text-secondary);margin-bottom:22px}
  a{color:var(--accent-dark);text-underline-offset:3px}
  .btn{display:inline-flex;padding:14px 26px;background:var(--accent-dark);color:#fff;
    text-decoration:none;font-weight:500;font-size:16px}
  .btn:hover{background:#12545E}
  .tel{margin-top:22px;font-size:17px;color:var(--text-secondary)}
</style>
</head>
<body>
  <div class="box">
    <svg viewBox="36 5 131 100" fill="none" aria-hidden="true" width="131" height="100">
      <g transform="translate(-18,0)">
        <path class="mm-ring" d="M130 26 A40 44 0 1 0 130 84 L130 55" stroke-width="9.72" fill="none"/>
        <path class="mm-inner" d="M117 40 A22 24 0 1 0 117 70 L117 55" stroke-width="4.59" fill="none"/>
        <path class="mm-beat" d="M100 55 L138 55 L145 41 L152 71 L159 55 L180 55" stroke-width="6.75" fill="none"/>
      </g>
    </svg>
    <h1>Questa pagina non esiste</h1>
    <p>L&rsquo;indirizzo potrebbe essere stato digitato male o non essere più valido.</p>
    <a class="btn" href="/">Torna alla pagina principale</a>
    <p class="tel">Per fissare un appuntamento: <a href="tel:+39098582500">0985 82500</a>, dal lunedì al venerdì dalle 15:30 alle 19:30.</p>
  </div>
</body>
</html>
